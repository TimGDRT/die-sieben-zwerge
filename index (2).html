<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Die sieben Zwerge graben</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1a0f08;font-family:'Fredoka',system-ui,sans-serif;color:#f6e7c8;
    touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer}
  .hud{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:14px;padding:12px 16px;pointer-events:none;z-index:2}
  .title{font-weight:700;font-size:19px;letter-spacing:.02em;text-shadow:0 2px 0 #000a;white-space:nowrap}
  .progress{flex:1;max-width:520px;margin:0 auto;display:flex;align-items:center;gap:10px}
  .bar{flex:1;height:14px;background:#0009;border:2px solid #7a5532;border-radius:10px;overflow:hidden;box-shadow:inset 0 2px 4px #000}
  .fill{height:100%;width:0;background:linear-gradient(90deg,#ffe08a,#ffb02e);border-radius:8px;transition:width .25s ease}
  .count{font-weight:600;font-variant-numeric:tabular-nums;min-width:64px;text-align:right;text-shadow:0 2px 0 #000a;white-space:nowrap}
  .btns{display:flex;gap:8px;pointer-events:auto}
  .icon-btn{width:42px;height:42px;border-radius:12px;border:2px solid #7a5532;background:#2a1a0ee0;color:#f6e7c8;font-size:19px;cursor:pointer;display:grid;place-items:center;font-family:inherit}
  .icon-btn:hover{background:#3d2717}
  .lang{display:flex;height:42px;border:2px solid #7a5532;border-radius:12px;overflow:hidden;background:#2a1a0ee0}
  .lang button{font-family:inherit;font-weight:600;font-size:15px;border:none;background:transparent;color:#f6e7c8;padding:0 10px;cursor:pointer}
  .lang button.active{background:#ffcf5a;color:#3a1f05}
  .hint{position:fixed;left:50%;top:20%;transform:translateX(-50%);text-align:center;pointer-events:none;z-index:2;transition:opacity .7s;width:min(92vw,720px)}
  .hint h1{margin:0 0 10px;font-size:clamp(28px,5vw,52px);font-weight:700;text-shadow:0 3px 0 #000,0 0 26px #000}
  .hint p{margin:0;font-size:clamp(16px,2.4vw,23px);animation:pulse 1.6s ease-in-out infinite;text-shadow:0 2px 0 #000,0 0 14px #000}
  .key{display:inline-block;border:2px solid #f6e7c8;border-bottom-width:4px;border-radius:7px;padding:0 9px;margin:0 3px;font-weight:600}
  @keyframes pulse{50%{opacity:.45}}
  .gone{opacity:0}
  .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000b;z-index:5;padding:20px}
  .modal.open{display:flex;animation:fade .35s ease}
  @keyframes fade{from{opacity:0}}
  .card{background:linear-gradient(#3d2615,#22140a);border:3px solid #9a6e3e;border-radius:22px;padding:26px 26px 22px;max-width:430px;width:100%;
    text-align:center;box-shadow:0 24px 70px #000,inset 0 1px 0 #ffffff22}
  .card h2{margin:4px 0 10px;font-size:30px}
  .card p{margin:0 0 14px;font-size:17px;line-height:1.4;color:#efdcb8}
  .win h2{font-size:clamp(34px,7vw,46px);color:#ffe08a;text-shadow:0 3px 0 #6b3d10}
  .win{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{from{transform:scale(.6);opacity:0}}
  .gem-ico{width:120px;height:108px;display:block;margin:0 auto 4px;filter:drop-shadow(0 0 18px #7fdcff);animation:bob 2.2s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}
  .stats{font-size:15px!important;opacity:.85}
  button.big{font-family:inherit;font-size:20px;font-weight:600;padding:12px 26px;border-radius:14px;border:none;cursor:pointer;
    background:linear-gradient(#ffcf5a,#f39c1e);color:#3a1f05;box-shadow:0 4px 0 #8a4f0c;margin-top:4px}
  button.big:active{transform:translateY(2px);box-shadow:0 2px 0 #8a4f0c}
  .opts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
  .opt{font-family:inherit;font-size:18px;font-weight:600;min-width:62px;padding:9px 12px;border-radius:12px;border:2px solid #9a6e3e;background:#2a1a0e;color:#f6e7c8;cursor:pointer}
  .opt.active{background:#ffcf5a;color:#3a1f05;border-color:#ffcf5a}
  .custom{display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:12px;font-size:16px}
  .custom input{width:80px;font-family:inherit;font-size:17px;padding:7px 8px;border-radius:10px;border:2px solid #9a6e3e;background:#170d06;color:#f6e7c8;text-align:center}
  .custom button,.ghost{font-family:inherit;font-size:16px;font-weight:600;padding:8px 14px;border-radius:10px;border:2px solid #9a6e3e;background:#2a1a0e;color:#f6e7c8;cursor:pointer}
  .note{font-size:14px!important;opacity:.7}
  @media (max-width:560px){.title{display:none}.hud{padding:10px;gap:8px}.count{min-width:0}.lang button{padding:0 8px}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud">
  <div class="title" data-i18n="title">⛏ Zwergen-Tunnel</div>
  <div class="progress">
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="count" id="count">0 / 30</div>
  </div>
  <div class="btns">
    <div class="lang" role="group" aria-label="Sprache / Langue">
      <button data-lang="de">DE</button><button data-lang="fr">FR</button>
    </div>
    <button class="icon-btn" id="soundBtn" data-i18n-title="sound">🔊</button>
    <button class="icon-btn" id="setBtn" data-i18n-title="settings">⚙</button>
  </div>
</div>

<div class="hint" id="hint">
  <h1 data-i18n="hintTitle">Tief unter der Erde …</h1>
  <p data-i18n-html="hintText">Tippe auf den Bildschirm oder drücke die <span class="key">Leertaste</span></p>
</div>

<div class="modal" id="win">
  <div class="card win">
    <svg class="gem-ico" viewBox="0 0 100 90" aria-hidden="true">
      <defs>
        <linearGradient id="ga" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9fbff"/><stop offset="1" stop-color="#57c6f2"/></linearGradient>
        <linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fdcff"/><stop offset="1" stop-color="#1c6fb8"/></linearGradient>
      </defs>
      <polygon points="28,8 72,8 94,30 50,86 6,30" fill="url(#gb)"/>
      <polygon points="28,8 72,8 62,30 38,30" fill="url(#ga)"/>
      <polygon points="6,30 28,8 38,30" fill="#a8ecff"/>
      <polygon points="94,30 72,8 62,30" fill="#3fa6dc"/>
      <polygon points="6,30 38,30 50,86" fill="#5fc4ef"/>
      <polygon points="94,30 62,30 50,86" fill="#1f78bf"/>
      <g fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="1.2">
        <polygon points="28,8 72,8 94,30 50,86 6,30"/><path d="M6 30H94M38 30L50 86L62 30M28 8L38 30M72 8L62 30"/>
      </g>
    </svg>
    <h2 data-i18n="winTitle">Glückwunsch!</h2>
    <p data-i18n="winText">Die sieben Zwerge haben sich bis zum riesigen Edelstein durchgegraben!</p>
    <p class="stats" id="stats"></p>
    <button class="big" id="again" data-i18n="again">Nochmal graben ⛏</button>
  </div>
</div>

<div class="modal" id="settings">
  <div class="card">
    <h2 data-i18n="settings">Einstellungen</h2>
    <p data-i18n="howMany">Wie viele Schläge braucht es bis zum Edelstein?</p>
    <div class="opts" id="opts"></div>
    <div class="custom"><span data-i18n="custom">Eigene Zahl:</span>
      <input type="number" id="customN" min="3" max="500" inputmode="numeric">
      <button id="customOk">OK</button>
    </div>
    <p class="note" data-i18n="note">Das Spiel startet danach neu.</p>
    <button class="ghost" id="closeSet" data-i18n="close">Schließen</button>
  </div>
</div>

<script>
(() => {
'use strict';
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');

// ---------- helpers ----------
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-(1-t)*(1-t);
const easeIn=t=>t*t;
function shade(hex,f){const n=parseInt(hex.slice(1),16);const c=v=>Math.max(0,Math.min(255,Math.round(v*f)));return `rgb(${c(n>>16)},${c(n>>8&255)},${c(n&255)})`}
function makeLayer(){const c=document.createElement('canvas');c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);return [c,x]}

// ---------- state ----------
let W=0,H=0,dpr=1,s=1;
const L={};
let earthC,earthX,backC,backX,staticC,staticX,lightC,lightX;
let total=30;
try{const v=parseInt(localStorage.getItem('zwerge-total'),10);if(v>=3&&v<=500)total=v;}catch(e){}
let SEED=(Math.random()*1e9)|0;
let hits=0,carved=0,won=false,wonAt=0,winShown=false,startMs=0,winMs=0;
let time=0,dirty=true,lastStatic=-1,shake=0;
let parts=[],sparkles=[],confetti=[];
let settingsOpen=false;

const DW=[
  {tunic:'#c0392b',hat:'#8e2a1d',beard:'#f4f1ea',skin:'#f2c79a',bl:1.05,k:1.00},
  {tunic:'#2f6db5',hat:'#5a3a8a',beard:'#e6dccb',skin:'#eebf8e',bl:0.90,k:0.95},
  {tunic:'#2e8b57',hat:'#a0522d',beard:'#cfc3ad',skin:'#f0c090',bl:1.15,k:1.04},
  {tunic:'#d9a21b',hat:'#2d6a8f',beard:'#ffffff',skin:'#f3cba2',bl:0.85,k:0.90},
  {tunic:'#8048b8',hat:'#2f8a72',beard:'#a8998a',skin:'#e9b98a',bl:1.00,k:1.00},
  {tunic:'#e0702a',hat:'#3a57a8',beard:'#efe7da',skin:'#f2c79a',bl:1.10,k:0.97},
  {tunic:'#1f9090',hat:'#b8344c',beard:'#d9d1c1',skin:'#edc196',bl:0.95,k:1.06},
];
let dwarfs=DW.map(c=>({c,x:-999,phase:Math.random()*6,moving:false,swingT:-1,delay:0}));

// ---------- layout ----------
function layout(){
  W=innerWidth;H=innerHeight;dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
  s=Math.max(0.42,Math.min(1.7,Math.min(W/950,H/560)));
  if(W<H) s=Math.max(s,Math.min(0.9,W/600));
  L.dh=82*s;                 // Zwergenhöhe
  L.th=L.dh*1.5;             // Tunnelhöhe
  L.floor=Math.round(H*(W<H?0.62:0.68));
  L.R=Math.min(130*s,W*0.2);
  L.caveCx=W-Math.max(18*s,W*0.03)-L.R;
  L.caveRy=L.R*0.95;
  L.caveCy=L.floor-L.caveRy*0.78;
  L.gw=L.R*0.95; L.gh=L.gw*0.95;
  L.gemCx=L.caveCx+L.R*0.12;
  L.gemCy=L.floor-L.gh*0.58;
  L.entry=L.dh*0.5;
  L.end=L.caveCx-L.R*1.12-L.th*0.45;
  L.spacing=L.dh*0.62;
  [earthC,earthX]=makeLayer();[backC,backX]=makeLayer();[staticC,staticX]=makeLayer();[lightC,lightX]=makeLayer();
}

function faceX(n){
  if(n<=0) return -L.th*2;
  const f=Math.min(1,n/total);
  return Math.max(L.dh*1.25, L.entry+(L.end-L.entry)*f);
}

// ---------- world generation ----------
function genEarth(){
  const r=rng(SEED);
  const x=earthX;
  x.globalCompositeOperation='source-over';
  const g=x.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#6e4527');g.addColorStop(.5,'#5b3820');g.addColorStop(1,'#422715');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  // Erdschichten
  for(let i=0;i<8;i++){
    const y0=r()*H,amp=(8+r()*28)*s,th=(18+r()*70)*s,f=0.002+r()*0.004,ph=r()*6;
    x.beginPath();
    for(let px=0;px<=W+10;px+=10) x.lineTo(px,y0+Math.sin(px*f+ph)*amp);
    for(let px=W+10;px>=0;px-=10) x.lineTo(px,y0+th+Math.sin(px*f+ph+0.7)*amp);
    x.closePath();
    x.fillStyle=r()<.5?`rgba(30,14,4,${0.08+r()*0.14})`:`rgba(150,100,58,${0.06+r()*0.12})`;
    x.fill();
  }
  // Krümel
  const n=Math.floor(W*H/42);
  for(let i=0;i<n;i++){
    const px=r()*W,py=r()*H,sz=(0.6+r()*1.8)*Math.max(1,s*0.8);
    x.fillStyle=r()<.55?`rgba(25,12,4,${0.2+r()*0.35})`:`rgba(175,125,80,${0.12+r()*0.28})`;
    x.fillRect(px,py,sz,sz);
  }
  // Steine
  const ns=Math.floor(W*H/8000);
  for(let i=0;i<ns;i++){
    const px=r()*W,py=r()*H,rx=(3+r()*r()*18)*s+1.5,ry=rx*(0.55+r()*0.35),rot=r()*3;
    const hue=22+r()*18,sat=8+r()*16,lig=26+r()*24;
    x.save();x.translate(px,py);x.rotate(rot);
    x.fillStyle=`hsl(${hue},${sat}%,${lig-10}%)`;x.beginPath();x.ellipse(rx*0.12,ry*0.18,rx,ry,0,0,7);x.fill();
    x.fillStyle=`hsl(${hue},${sat}%,${lig}%)`;x.beginPath();x.ellipse(0,0,rx,ry,0,0,7);x.fill();
    x.fillStyle=`hsla(${hue},${sat}%,${lig+22}%,.55)`;x.beginPath();x.ellipse(-rx*0.3,-ry*0.35,rx*0.4,ry*0.3,0,0,7);x.fill();
    x.restore();
  }
  // Wurzeln oben
  x.strokeStyle='rgba(40,22,10,.55)';x.lineCap='round';
  for(let i=0;i<Math.ceil(W/140);i++){
    let px=r()*W,py=-5,ang=Math.PI/2+(r()-.5)*0.6,len=(60+r()*120)*s;
    x.lineWidth=(2+r()*3)*s;x.beginPath();x.moveTo(px,py);
    for(let k=0;k<12;k++){ang+=(r()-.5)*0.6;px+=Math.cos(ang)*len/12;py+=Math.sin(ang)*len/12;x.lineTo(px,py);x.lineWidth*=0.92;}
    x.stroke();
  }
  // Rückwand des Tunnels (dunkler)
  backX.drawImage(earthC,0,0,W,H);
  backX.fillStyle='rgba(14,7,2,0.66)';backX.fillRect(0,0,W,H);
  const bg=backX.createLinearGradient(0,L.floor-L.th*1.2,0,L.floor);
  bg.addColorStop(0,'rgba(0,0,0,.35)');bg.addColorStop(1,'rgba(0,0,0,0)');
  backX.fillStyle=bg;backX.fillRect(0,L.floor-L.th*1.2,W,L.th*1.2);
}

function blob(x,r,cx,cy,rx,ry){
  x.beginPath();
  const n=16;
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2,k=0.86+r()*0.24;
    let px=cx+Math.cos(a)*rx*k,py=cy+Math.sin(a)*ry*k;
    if(py>L.floor) py=L.floor;
    i?x.lineTo(px,py):x.moveTo(px,py);
  }
  x.closePath();x.fill();
}

function carveCave(){
  const r=rng(SEED+7);
  const x=earthX;
  x.save();x.globalCompositeOperation='destination-out';x.fillStyle='#000';
  x.beginPath();
  const n=28;
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2,k=0.9+r()*0.18;
    let px=L.caveCx+Math.cos(a)*L.R*k,py=L.caveCy+Math.sin(a)*L.caveRy*k;
    if(py>L.floor) py=L.floor;
    i?x.lineTo(px,py):x.moveTo(px,py);
  }
  x.closePath();x.fill();x.restore();
  // Steinhaufen unter dem Edelstein
  const m=rng(SEED+99);L.mound=[];
  for(let i=0;i<11;i++){
    const off=(m()-.5)*L.gw*0.95,rx=L.gw*(0.09+m()*0.09),ry=rx*(0.6+m()*0.3);
    const lift=m()*L.gh*0.16*(1-Math.abs(off)/(L.gw*0.5));
    L.mound.push({x:L.gemCx+off,y:L.floor-ry*0.55-lift,rx,ry,l:24+m()*20,h:22+m()*14});
  }
  L.mound.push({x:L.gemCx,y:L.floor-L.gh*0.17,rx:L.gw*0.2,ry:L.gw*0.12,l:34,h:28});
  L.mound.sort((a,b)=>a.y-b.y);
}

function carveHit(i){
  const r=rng((SEED^Math.imul(i,2654435761))>>>0);
  const x=earthX;
  const x0=i===1?-L.th:faceX(i-1),x1=faceX(i);
  x.save();x.globalCompositeOperation='destination-out';x.fillStyle='#000';
  x.fillRect(x0-2,L.floor-L.th*0.8,(x1-L.th*0.15)-x0+2,L.th*0.8);
  const step=L.th*0.32,n=Math.max(1,Math.ceil((x1-x0)/step));
  for(let k=0;k<=n;k++){
    const cx=x0+(x1-x0)*k/n-L.th*0.18;
    blob(x,r,cx,L.floor-L.th*0.5+(r()-.5)*L.th*0.1,L.th*(0.4+r()*0.14),L.th*(0.5+r()*0.08));
  }
  if(i>=total){ // Durchbruch in die Höhle
    for(let px=x1;px<L.caveCx;px+=step) blob(x,r,px,L.floor-L.th*0.5+(r()-.5)*L.th*0.1,L.th*(0.42+r()*0.14),L.th*(0.5+r()*0.08));
    x.fillRect(x1-L.th*0.3,L.floor-L.th*0.8,L.caveCx-x1+L.th*0.3,L.th*0.8);
  }
  x.restore();
}

function buildWorld(){
  genEarth();carveCave();
  for(let i=1;i<=carved;i++) carveHit(i);
  dirty=true;
}

// ---------- static scene ----------
function drawCrystal(x,px,py,len,ang,hue){
  const dx=Math.sin(ang),dy=-Math.cos(ang),qx=-dy,qy=dx,bw=len*0.32;
  const p=(a,b)=>[px+dx*a+qx*b,py+dy*a+qy*b];
  const P=[p(0,-bw/2),p(len*0.75,-bw/2),p(len,0),p(len*0.75,bw/2),p(0,bw/2)];
  x.fillStyle=`hsl(${hue},75%,62%)`;x.beginPath();x.moveTo(...P[0]);x.lineTo(...P[1]);x.lineTo(...P[2]);x.lineTo(...p(0,0));x.closePath();x.fill();
  x.fillStyle=`hsl(${hue},70%,42%)`;x.beginPath();x.moveTo(...p(0,0));x.lineTo(...P[2]);x.lineTo(...P[3]);x.lineTo(...P[4]);x.closePath();x.fill();
  x.strokeStyle=`hsla(${hue},90%,88%,.7)`;x.lineWidth=Math.max(1,s);x.beginPath();x.moveTo(...P[0]);x.lineTo(...P[1]);x.lineTo(...P[2]);x.lineTo(...P[3]);x.lineTo(...P[4]);x.stroke();
}
function drawBeam(x,bx){
  const w=L.dh*0.12,top=L.floor-L.th*0.9;
  x.fillStyle='rgba(0,0,0,.35)';x.fillRect(bx-w/2+3*s,top+4*s,w,L.floor-top);
  x.fillStyle='#6e4a2a';x.fillRect(bx-w/2,top,w,L.floor-top);
  x.fillStyle='#7d5633';x.fillRect(bx-L.th*0.38,top-L.dh*0.06,L.th*0.76,L.dh*0.11);
  x.strokeStyle='#3b2614';x.lineWidth=Math.max(1,1.5*s);
  x.strokeRect(bx-w/2,top,w,L.floor-top);x.strokeRect(bx-L.th*0.38,top-L.dh*0.06,L.th*0.76,L.dh*0.11);
  x.strokeStyle='rgba(40,24,10,.5)';x.beginPath();x.moveTo(bx-w*0.1,top+L.th*0.15);x.lineTo(bx-w*0.1,L.floor-L.th*0.1);x.stroke();
}
function renderStatic(){
  const x=staticX;
  x.clearRect(0,0,W,H);
  x.drawImage(backC,0,0,W,H);
  x.save();
  x.shadowColor='rgba(0,0,0,.85)';x.shadowBlur=16*s*dpr;x.shadowOffsetY=7*s*dpr;
  x.drawImage(earthC,0,0,W,H);
  x.restore();
  const fn=faceX(carved);
  for(let bx=L.entry+L.dh*2.6;bx<fn-L.th*0.75;bx+=L.dh*3.4) drawBeam(x,bx);
  // Kristalle in der Höhle
  const c=L.R;
  drawCrystal(x,L.caveCx-c*0.55,L.floor+2,c*0.28,-0.35,285);
  drawCrystal(x,L.caveCx-c*0.47,L.floor+2,c*0.4,0.05,300);
  drawCrystal(x,L.caveCx-c*0.38,L.floor+2,c*0.22,0.45,265);
  drawCrystal(x,L.caveCx+c*0.6,L.floor+2,c*0.3,-0.3,150);
  drawCrystal(x,L.caveCx+c*0.68,L.floor+2,c*0.2,0.4,165);

// ---------- gem ----------
function drawGem(t){
  const w=L.gw,h=L.gh,cx=L.gemCx,cy=L.gemCy+Math.sin(t*1.6)*h*0.012;
  const pulse=0.75+0.25*Math.sin(t*2.2);
  const gg=ctx.createRadialGradient(cx,cy,0,cx,cy,w*1.35);
  gg.addColorStop(0,`rgba(150,235,255,${0.5*pulse})`);gg.addColorStop(.45,`rgba(80,170,255,${0.18*pulse})`);gg.addColorStop(1,'rgba(80,170,255,0)');
  ctx.fillStyle=gg;ctx.fillRect(cx-w*1.4,cy-w*1.4,w*2.8,w*2.8);
  const ty=cy-0.5*h,gy=cy-0.18*h,by=cy+0.5*h;
  const T=[-0.3,-0.1,0.1,0.3].map(f=>[cx+f*w,ty]);
  const G=[-0.5,-0.25,0,0.25,0.5].map(f=>[cx+f*w,gy]);
  const B=[cx,by];
  const seq=[G[0],T[0],G[1],T[1],G[2],T[2],G[3],T[3],G[4]];
  const facets=[];
  for(let i=0;i<seq.length-2;i++) facets.push([seq[i],seq[i+1],seq[i+2]]);
  facets.push([T[0],T[3],[cx+0.18*w,ty+0.001],[cx-0.18*w,ty]]);
  for(let k=0;k<8;k++){const a=[cx+(-0.5+k*0.125)*w,gy],b=[cx+(-0.5+(k+1)*0.125)*w,gy];facets.push([a,b,B]);}
  facets.forEach((f,k)=>{
    const l=56+22*Math.sin(k*1.9+t*1.4)+(k>=8?-8:6);
    ctx.fillStyle=`hsl(${192+(k*7)%24},85%,${l}%)`;
    ctx.beginPath();ctx.moveTo(...f[0]);for(let i=1;i<f.length;i++)ctx.lineTo(...f[i]);ctx.closePath();ctx.fill();
  });
  ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=Math.max(1,1.2*s);ctx.lineJoin='round';
  facets.forEach(f=>{ctx.beginPath();ctx.moveTo(...f[0]);for(let i=1;i<f.length;i++)ctx.lineTo(...f[i]);ctx.closePath();ctx.stroke();});
  ctx.strokeStyle='rgba(230,250,255,.9)';ctx.lineWidth=Math.max(1.5,2*s);
  ctx.beginPath();ctx.moveTo(...T[0]);ctx.lineTo(...T[3]);ctx.lineTo(...G[4]);ctx.lineTo(...B);ctx.lineTo(...G[0]);ctx.closePath();ctx.stroke();
  // Glanzstreifen
  const sh=(t*0.35)%1.6-0.3;
  ctx.save();ctx.beginPath();ctx.moveTo(...T[0]);ctx.lineTo(...T[3]);ctx.lineTo(...G[4]);ctx.lineTo(...B);ctx.lineTo(...G[0]);ctx.closePath();ctx.clip();
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();
  const sx=cx+(sh-0.5)*w*1.6;
  ctx.moveTo(sx,ty);ctx.lineTo(sx+w*0.12,ty);ctx.lineTo(sx-w*0.3,by);ctx.lineTo(sx-w*0.42,by);ctx.closePath();ctx.fill();
  ctx.restore();
  // Steinhaufen
  L.mound.forEach(m=>{
    ctx.fillStyle=`hsl(${m.h},14%,${m.l-9}%)`;ctx.beginPath();ctx.ellipse(m.x+m.rx*0.1,m.y+m.ry*0.15,m.rx,m.ry,0,0,7);ctx.fill();
    ctx.fillStyle=`hsl(${m.h},14%,${m.l}%)`;ctx.beginPath();ctx.ellipse(m.x,m.y,m.rx,m.ry,0,0,7);ctx.fill();
    ctx.fillStyle=`hsla(${m.h},20%,${m.l+25}%,.5)`;ctx.beginPath();ctx.ellipse(m.x-m.rx*0.3,m.y-m.ry*0.4,m.rx*0.4,m.ry*0.28,0,0,7);ctx.fill();
  });
}

// ---------- dwarfs ----------
function swingAngle(t){
  const REST=-2.35,UP=-1.7,HIT=-4.85;
  if(t<0) return REST;
  if(t<0.35) return lerp(REST,UP,easeOut(t/0.35));
  if(t<0.55) return lerp(UP,HIT,easeIn((t-0.35)/0.2));
  return lerp(HIT,REST,easeOut((t-0.55)/0.45));
}
function dwarfTarget(i){
  if(carved===0) return -L.dh*1.3-i*L.spacing;
  const lead=won?L.gemCx-L.gw*0.5-L.dh*0.36:faceX(carved)-L.dh*0.42;
  return lead-i*L.spacing;
}
function backHand(d,h){return won?[-0.16*h,-0.78*h]:[-0.13*h,-0.31*h]}
function drawDwarf(d,i){
  const c=d.c,h=L.dh*c.k;
  if(d.x<-h||d.x>W+h) return;
  let bob=d.moving?-Math.abs(Math.sin(d.phase))*h*0.05:0;
  if(won) bob=-Math.abs(Math.sin(time*6+i*0.9))*h*0.26;
  // Schatten
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(d.x+h*0.02,L.floor,h*(0.22+bob/h*0.3),h*0.04,0,0,7);ctx.fill();
  ctx.save();ctx.translate(d.x,L.floor+bob);
  ctx.lineCap='round';ctx.lineJoin='round';
  const tunicD=shade(c.tunic,0.72);
  // hinterer Arm
  const bh=backHand(d,h);
  ctx.strokeStyle=tunicD;ctx.lineWidth=0.075*h;
  ctx.beginPath();ctx.moveTo(-0.08*h,-0.5*h);ctx.lineTo(bh[0],bh[1]);ctx.stroke();
  ctx.fillStyle=shade(c.skin.length===7?c.skin:'#f2c79a',0.85);ctx.beginPath();ctx.arc(bh[0],bh[1],0.04*h,0,7);ctx.fill();
  if(i===1){ // Laterne
    const lx=bh[0],ly=bh[1]+0.02*h;
    ctx.strokeStyle='#4a3a22';ctx.lineWidth=0.012*h;ctx.beginPath();ctx.arc(lx,ly+0.03*h,0.04*h,Math.PI,0);ctx.stroke();
    ctx.fillStyle='#ffe28a';ctx.fillRect(lx-0.04*h,ly+0.03*h,0.08*h,0.1*h);
    ctx.fillStyle='#8a6a2a';ctx.fillRect(lx-0.05*h,ly+0.02*h,0.1*h,0.02*h);ctx.fillRect(lx-0.05*h,ly+0.13*h,0.1*h,0.02*h);
    ctx.fillStyle='#fff6c8';ctx.beginPath();ctx.arc(lx,ly+0.08*h,0.018*h,0,7);ctx.fill();
  }
  // Beine & Stiefel
  const lp=d.moving?Math.sin(d.phase)*h*0.06:0;
  [[-0.08,lp],[0.06,-lp]].forEach(([bx,o],k)=>{
    ctx.fillStyle='#4a3020';ctx.fillRect((bx-0.04)*h+o,-0.17*h,0.08*h,0.1*h);
    ctx.fillStyle=k?'#3a2414':'#2e1c10';ctx.beginPath();ctx.ellipse(bx*h+o+0.02*h,-0.04*h,0.075*h,0.04*h,0,0,7);ctx.fill();
  });
  // Kittel
  ctx.fillStyle=c.tunic;
  ctx.beginPath();ctx.moveTo(-0.15*h,-0.56*h);ctx.quadraticCurveTo(0,-0.62*h,0.15*h,-0.56*h);
  ctx.lineTo(0.21*h,-0.13*h);ctx.quadraticCurveTo(0,-0.09*h,-0.21*h,-0.13*h);ctx.closePath();ctx.fill();
  ctx.fillStyle=tunicD;
  ctx.beginPath();ctx.moveTo(-0.205*h,-0.17*h);ctx.lineTo(0.205*h,-0.17*h);ctx.lineTo(0.21*h,-0.13*h);ctx.quadraticCurveTo(0,-0.09*h,-0.21*h,-0.13*h);ctx.closePath();ctx.fill();
  // Gürtel
  ctx.fillStyle='#2b1a0d';ctx.fillRect(-0.19*h,-0.3*h,0.38*h,0.05*h);
  ctx.fillStyle='#e8c14a';ctx.fillRect(0.02*h,-0.305*h,0.06*h,0.06*h);ctx.fillStyle='#2b1a0d';ctx.fillRect(0.035*h,-0.29*h,0.03*h,0.03*h);
  // Kopf
  ctx.fillStyle=shade(c.skin,0.88);ctx.beginPath();ctx.arc(-0.065*h,-0.67*h,0.032*h,0,7);ctx.fill();
  ctx.fillStyle=c.skin;ctx.beginPath();ctx.arc(0.03*h,-0.67*h,0.12*h,0,7);ctx.fill();
  // Bart
  ctx.fillStyle=c.beard;
  ctx.beginPath();ctx.moveTo(-0.07*h,-0.68*h);
  ctx.quadraticCurveTo(-0.1*h,-0.45*h,0.04*h,(-0.66+0.3*c.bl)*h);
  ctx.quadraticCurveTo(0.21*h,-0.5*h,0.16*h,-0.66*h);
  ctx.quadraticCurveTo(0.05*h,-0.6*h,-0.07*h,-0.68*h);ctx.fill();
  ctx.fillStyle=shade(c.beard,0.84);
  ctx.beginPath();ctx.moveTo(0.0*h,-0.6*h);ctx.quadraticCurveTo(0.02*h,-0.48*h,0.04*h,(-0.66+0.28*c.bl)*h);ctx.lineTo(0.06*h,-0.6*h);ctx.fill();
  // Schnurrbart, Nase, Auge
  ctx.fillStyle=c.beard;ctx.beginPath();ctx.ellipse(0.1*h,-0.63*h,0.075*h,0.027*h,-0.15,0,7);ctx.fill();
  ctx.fillStyle='#e39a7a';ctx.beginPath();ctx.arc(0.15*h,-0.67*h,0.04*h,0,7);ctx.fill();
  ctx.fillStyle='#2a1a10';
  if(won){ctx.lineWidth=0.014*h;ctx.strokeStyle='#2a1a10';ctx.beginPath();ctx.arc(0.085*h,-0.715*h,0.018*h,Math.PI*1.1,Math.PI*1.9);ctx.stroke();}
  else{ctx.beginPath();ctx.arc(0.088*h,-0.72*h,0.017*h,0,7);ctx.fill();}
  ctx.strokeStyle=shade(c.beard,0.7);ctx.lineWidth=0.016*h;ctx.beginPath();ctx.moveTo(0.06*h,-0.755*h);ctx.lineTo(0.115*h,-0.75*h);ctx.stroke();
  // Mütze
  const tip=(d.moving?Math.sin(d.phase*0.5)*0.03:0)+(won?Math.sin(time*6+i)*0.04:0);
  ctx.fillStyle=c.hat;
  ctx.beginPath();ctx.moveTo(-0.13*h,-0.72*h);
  ctx.quadraticCurveTo(-0.1*h,-0.94*h,(-0.27+tip)*h,-1.03*h);
  ctx.quadraticCurveTo(-0.02*h,-0.99*h,0.16*h,-0.73*h);ctx.closePath();ctx.fill();
  ctx.fillStyle=shade(c.hat,0.7);ctx.beginPath();ctx.ellipse(0.015*h,-0.725*h,0.155*h,0.035*h,0,0,7);ctx.fill();
  ctx.fillStyle=c.beard;ctx.beginPath();ctx.arc((-0.27+tip)*h,-1.03*h,0.032*h,0,7);ctx.fill();
  // vorderer Arm + Spitzhacke
  const th=won?-2.9+Math.sin(time*8+i)*0.3:swingAngle(d.delay>0?-1:d.swingT);
  const dx=Math.sin(th),dy=Math.cos(th),px=Math.cos(th),py=-Math.sin(th);
  const sx=0.05*h,sy=-0.5*h,hx=sx+dx*0.2*h,hy=sy+dy*0.2*h;
  const ex=hx+dx*0.33*h,ey=hy+dy*0.33*h;
  ctx.strokeStyle='#8b5a2b';ctx.lineWidth=0.034*h;
  ctx.beginPath();ctx.moveTo(hx-dx*0.07*h,hy-dy*0.07*h);ctx.lineTo(ex,ey);ctx.stroke();
  ctx.strokeStyle='#5d6670';ctx.lineWidth=0.055*h;
  ctx.beginPath();ctx.moveTo(ex+px*0.16*h-dx*0.04*h,ey+py*0.16*h-dy*0.04*h);ctx.quadraticCurveTo(ex+dx*0.04*h,ey+dy*0.04*h,ex-px*0.16*h-dx*0.04*h,ey-py*0.16*h-dy*0.04*h);ctx.stroke();
  ctx.strokeStyle='#b9c2cc';ctx.lineWidth=0.022*h;
  ctx.beginPath();ctx.moveTo(ex+px*0.14*h-dx*0.03*h,ey+py*0.14*h-dy*0.03*h);ctx.quadraticCurveTo(ex+dx*0.05*h,ey+dy*0.05*h,ex-px*0.14*h-dx*0.03*h,ey-py*0.14*h-dy*0.03*h);ctx.stroke();
  ctx.strokeStyle=c.tunic;ctx.lineWidth=0.08*h;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(hx,hy);ctx.stroke();
  ctx.fillStyle=c.skin;ctx.beginPath();ctx.arc(hx,hy,0.042*h,0,7);ctx.fill();
  ctx.restore();
}

const DIRT=['#6b4426','#4e2f19','#7d5634','#8a8076','#3b2414','#a07a52'];
function spawnDirt(x,n){
  for(let i=0;i<n;i++) parts.push({
    x:x+(Math.random()-.5)*L.th*0.2,y:L.floor-L.th*(0.12+Math.random()*0.75),
    vx:-(40+Math.random()*260)*s,vy:-(40+Math.random()*280)*s,
    sz:(1.5+Math.random()*4.5)*s,life:0,max:1.4+Math.random()*1.4,col:DIRT[(Math.random()*DIRT.length)|0]});

}
function spawnConfetti(n){
  const cols=['#ffd36b','#7fdcff','#ff6b8a','#9dff8a','#c58bff','#ffffff','#ff9f43'];
  for(let i=0;i<n;i++) confetti.push({x:Math.random()*W,y:-20-Math.random()*H*0.5,vx:(Math.random()-.5)*60*s,vy:(60+Math.random()*140)*s,
    rot:Math.random()*6,vr:(Math.random()-.5)*8,w:(5+Math.random()*6)*s,h:(3+Math.random()*4)*s,col:cols[(Math.random()*cols.length)|0]});

// ---------- sound ----------
let AC=null,muted=false,noiseBuf=null;
try{muted=localStorage.getItem('zwerge-muted')==='1';}catch(e){}
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null}}
  if(AC&&AC.state==='suspended') AC.resume().catch(()=>{});
  return AC;
}
function sndHit(){
  if(muted||!AC) return;
  const a=AC,t=a.currentTime;
  if(!noiseBuf){const len=(0.2*a.sampleRate)|0;noiseBuf=a.createBuffer(1,len,a.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);}
  const src=a.createBufferSource();src.buffer=noiseBuf;
  const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=700+Math.random()*500;
  const g=a.createGain();g.gain.value=0.55;
  src.connect(f);f.connect(g);g.connect(a.destination);src.start(t);
  const o=a.createOscillator();o.type='triangle';o.frequency.setValueAtTime(1400+Math.random()*600,t);
  const og=a.createGain();og.gain.setValueAtTime(0.1,t);og.gain.exponentialRampToValueAtTime(0.001,t+0.13);
  o.connect(og);og.connect(a.destination);o.start(t);o.stop(t+0.14);
}
function sndWin(){
  if(muted||!AC) return;
  const a=AC,t0=a.currentTime;
  [523.25,659.25,783.99,1046.5,1318.5,1567.98].forEach((fr,i)=>{
    const o=a.createOscillator(),g=a.createGain();o.type=i<4?'triangle':'sine';o.frequency.value=fr;
    const t=t0+i*0.11,dur=i===5?1.2:0.35;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.16,t+0.02);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.05);
  });
}

// ---------- game logic ----------
const fillEl=document.getElementById('fill'),countEl=document.getElementById('count'),hintEl=document.getElementById('hint');
const winEl=document.getElementById('win'),setEl=document.getElementById('settings'),statsEl=document.getElementById('stats');
function updateHUD(){fillEl.style.width=(hits/total*100)+'%';countEl.textContent=hits+' / '+total;}

function press(){
  if(won||settingsOpen||hits>=total) return;
  ac();
  if(hits===0){startMs=performance.now();hintEl.classList.add('gone');}
  hits++;updateHUD();
  dwarfs.forEach((d,i)=>{if(d.swingT<0||d.swingT>0.55){d.swingT=0;d.delay=i*0.05;}});
}
function impact(){
  if(carved>=hits) return;
  while(carved<hits){carved++;carveHit(carved);}
  dirty=true;shake=0.12;
  spawnDirt(faceX(carved)+L.th*0.2,carved>=total?40:14);
  sndHit();
  if(carved>=total&&!won){won=true;wonAt=time;winMs=performance.now()-startMs;}
}

function renderStats(){statsEl.textContent=I18N[lang].stats(total,(winMs/1000).toFixed(1).replace('.',','));}

function showWin(){
  winShown=true;
  renderStats();
  winEl.classList.add('open');
  spawnConfetti(Math.round(160*Math.max(0.6,W/1200)));
  sndWin();
}
function restart(){
  SEED=(Math.random()*1e9)|0;
  hits=0;carved=0;won=false;winShown=false;
  parts=[];sparkles=[];confetti=[];
  winEl.classList.remove('open');hintEl.classList.remove('gone');
  dwarfs.forEach((d,i)=>{d.x=dwarfTarget(i);d.swingT=-1;d.delay=0;d.moving=false;});
  buildWorld();updateHUD();
}

function update(dt){
  dwarfs.forEach((d,i)=>{
    const tx=dwarfTarget(i),dx=tx-d.x,sp=L.dh*2.8*dt;
    if(Math.abs(dx)>0.5){d.x+=Math.sign(dx)*Math.min(Math.abs(dx),sp);d.moving=true;d.phase+=dt*11;}else d.moving=false;
    if(d.swingT>=0){
      if(d.delay>0) d.delay-=dt;
      else{const p=d.swingT;d.swingT+=dt/0.36;if(i===0&&p<0.55&&d.swingT>=0.55)impact();if(d.swingT>=1)d.swingT=-1;}
    }
  });
  if(carved<hits&&dwarfs[0].swingT<0) impact();
  const g=1100*s;
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.life+=dt;
    if(p.life>p.max){parts.splice(i,1);continue;}
    p.vy+=g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.y>L.floor-p.sz*0.5){p.y=L.floor-p.sz*0.5;p.vy*=-0.25;p.vx*=0.5;}
  }
  const rate=won?16:3;
  if(Math.random()<rate*dt) sparkles.push({x:L.gemCx+(Math.random()-.5)*L.gw*(won?1.6:0.9),y:L.gemCy+(Math.random()-.65)*L.gh*(won?1.4:0.8),life:0,max:0.5+Math.random()*0.6,sz:(6+Math.random()*10)*s});
  for(let i=sparkles.length-1;i>=0;i--){sparkles[i].life+=dt;if(sparkles[i].life>sparkles[i].max)sparkles.splice(i,1);}
  for(let i=confetti.length-1;i>=0;i--){const c=confetti[i];c.x+=c.vx*dt+Math.sin(time*3+i)*20*s*dt;c.y+=c.vy*dt;c.rot+=c.vr*dt;if(c.y>H+20)confetti.splice(i,1);}
  if(winShown&&confetti.length<60) spawnConfetti(3);
  if(won&&!winShown&&time-wonAt>2.2) showWin();
  shake=Math.max(0,shake-dt);
}

function draw(){
  ctx.save();
  ctx.clearRect(0,0,W,H);
  if(shake>0){const m=shake*22*s;ctx.translate((Math.random()-.5)*m,(Math.random()-.5)*m);}
  ctx.drawImage(staticC,-2,-2,W+4,H+4);
  drawGem(time);
  for(let i=dwarfs.length-1;i>=0;i--) drawDwarf(dwarfs[i],i);
  parts.forEach(p=>{ctx.globalAlpha=Math.min(1,(p.max-p.life)/0.5);ctx.fillStyle=p.col;ctx.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz);});
  ctx.globalAlpha=1;
  ctx.restore();

  // Licht & Dunkelheit
  const lx=lightX;
  lx.globalCompositeOperation='source-over';lx.clearRect(0,0,W,H);
  lx.fillStyle='rgba(8,4,2,0.42)';lx.fillRect(0,0,W,H);
  const vg=lx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3,W/2,H/2,Math.max(W,H)*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.32)');lx.fillStyle=vg;lx.fillRect(0,0,W,H);
  lx.globalCompositeOperation='destination-out';
  const lights=[];
  const lan=dwarfs[1];
  if(lan.x>-L.dh*2){const h=L.dh*lan.c.k,bh=backHand(lan,h);lights.push([lan.x+bh[0],L.floor+bh[1]+0.08*h,L.th*(2.3+Math.sin(time*9)*0.05),'255,170,70']);}
  lights.push([L.gemCx,L.gemCy,L.R*(2.1+0.12*Math.sin(time*2.2))*(won?1.4:1),'120,215,255']);
  lights.forEach(([x,y,r])=>{const g=lx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.55,'rgba(0,0,0,.6)');g.addColorStop(1,'rgba(0,0,0,0)');lx.fillStyle=g;lx.fillRect(x-r,y-r,r*2,r*2);});
  ctx.drawImage(lightC,0,0,W,H);
  ctx.save();ctx.globalCompositeOperation='lighter';
  lights.forEach(([x,y,r,col])=>{const g=ctx.createRadialGradient(x,y,0,x,y,r*0.8);g.addColorStop(0,`rgba(${col},.14)`);g.addColorStop(1,`rgba(${col},0)`);ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);});
  // Funkeln
  sparkles.forEach(p=>{
    const k=Math.sin(p.life/p.max*Math.PI),r=p.sz*k;
    ctx.strokeStyle=`rgba(255,255,255,${0.9*k})`;ctx.lineWidth=Math.max(1,1.6*s);
    ctx.beginPath();ctx.moveTo(p.x-r,p.y);ctx.lineTo(p.x+r,p.y);ctx.moveTo(p.x,p.y-r);ctx.lineTo(p.x,p.y+r);ctx.stroke();
    ctx.fillStyle=`rgba(200,245,255,${0.8*k})`;ctx.beginPath();ctx.arc(p.x,p.y,r*0.22,0,7);ctx.fill();
  });
  ctx.restore();
  confetti.forEach(c=>{ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.rot);ctx.fillStyle=c.col;ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);ctx.restore();});
}

let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;time+=dt;
  update(dt);
  if(dirty&&time-lastStatic>0.06){renderStatic();dirty=false;lastStatic=time;}
  draw();
  requestAnimationFrame(frame);
}

// ---------- input & UI ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();press();});
addEventListener('keydown',e=>{
  const isSpace=e.code==='Space'||e.key===' ';
  if(settingsOpen){if(e.key==='Escape')closeSettings();return;}
  if(winShown&&(isSpace||e.key==='Enter')){e.preventDefault();if(!e.repeat)restart();return;}
  if(isSpace){e.preventDefault();if(!e.repeat)press();}
});
document.getElementById('again').addEventListener('click',e=>{e.currentTarget.blur();restart();});

const soundBtn=document.getElementById('soundBtn');
function paintSound(){soundBtn.textContent=muted?'🔇':'🔊';}
soundBtn.addEventListener('click',e=>{muted=!muted;paintSound();if(!muted)ac();try{localStorage.setItem('zwerge-muted',muted?'1':'0');}catch(err){}e.currentTarget.blur();});
paintSound();

const optsEl=document.getElementById('opts');
function paintOpts(){
  optsEl.innerHTML='';
  [10,20,30,50,100].forEach(v=>{const b=document.createElement('button');b.className='opt'+(v===total?' active':'');b.textContent=v;b.onclick=()=>setTotal(v);optsEl.appendChild(b);});
  document.getElementById('customN').value=total;
}
function setTotal(v){
  v=Math.max(3,Math.min(500,Math.round(v)||30));
  total=v;try{localStorage.setItem('zwerge-total',String(v));}catch(e){}
  closeSettings();restart();
}
function openSettings(){settingsOpen=true;paintOpts();setEl.classList.add('open');}
function closeSettings(){settingsOpen=false;setEl.classList.remove('open');}
document.getElementById('setBtn').addEventListener('click',e=>{e.currentTarget.blur();openSettings();});
document.getElementById('closeSet').addEventListener('click',closeSettings);
document.getElementById('customOk').addEventListener('click',()=>setTotal(parseInt(document.getElementById('customN').value,10)));
document.getElementById('customN').addEventListener('keydown',e=>{if(e.key==='Enter')setTotal(parseInt(e.target.value,10));});
setEl.addEventListener('pointerdown',e=>{if(e.target===setEl)closeSettings();});

let rt=null;
addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{layout();buildWorld();dwarfs.forEach((d,i)=>d.x=dwarfTarget(i));},150);});

// ---------- start ----------
applyLang();
layout();buildWorld();
dwarfs.forEach((d,i)=>d.x=dwarfTarget(i));
updateHUD();
requestAnimationFrame(frame);
})();
</script>
